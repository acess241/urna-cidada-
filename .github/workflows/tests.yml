name: Testes da urna
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check public/app.js
      - run: npm ci --ignore-scripts
      - run: python scripts/build-pages.py
      - run: npm test
      - run: docker build -t urna-ci .
      - run: docker run --rm --entrypoint python urna-ci -c "from pathlib import Path; assert Path('/app/public/index.html').is_file(); Path('/app/server.py').read_text(); Path('/data/check').write_text('ok')"
  supabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: urna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Testar permissões e votação no PostgreSQL
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U postgres -d urna_test -v ON_ERROR_STOP=1 -f tests/supabase-bootstrap.sql
          psql -h localhost -U postgres -d urna_test -v ON_ERROR_STOP=1 -f supabase/migrations/001_urna.sql
          psql -h localhost -U postgres -d urna_test -v ON_ERROR_STOP=1 -f tests/supabase.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir pacote estático
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-public-key
        run: |
          python scripts/build-pages.py
          test -f pages-dist/admin.html
          test -f pages-dist/config.js

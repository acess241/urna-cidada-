name: Testes da urna
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check public/app.js
      - run: docker build -t urna-ci .
      - run: docker run --rm --entrypoint python urna-ci -c "from pathlib import Path; assert Path('/app/public/index.html').is_file(); Path('/app/server.py').read_text(); Path('/data/check').write_text('ok')"
